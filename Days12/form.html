<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap CSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="button_group.css">
</head>
<body>
    <div class="container">
        <h2>Form Demo</h2>
        <form>
            <div class="row">
                 <div class="mb-3 col-md-6">
        <label class="form-label" for="email" >Email</label>
        <input type="text" class="form-control" placeholder="Email" id="email"/>
    </div>
         <div class="mb-3 col-md-6">
        <label class="form-label" for="password" >Password</label>
        <input type="password" class="form-control" placeholder="Password" id="password"/>
    </div>

            </div>
       
   
      
     
        <div class="mv-3">
        <label class="form-label" for="address" >Address</label>
       
        
        <input type="address" class="form-control-small" placeholder="Address" id="Address"/></div>

         <div class="mb-3">
            <select class="form-select">
                <option selected>Chose your city</option>
                <option value="1">Mumbai</option>
                <option value="2">Delhi</option>
                <option value="3">Pune</option>
            </select>
         </div>
         <div class="normal nb-3">
            
            <input type="checkbox" id="agree"/>
            <label for="agree">Agree</label>

         </div>
            <div class=" nb-3 form-check">
            
            <input type="checkbox" id="agreebs" class="form-check-input"/>
            <label for="agreebs" class="form-check-label">Agree</label>

         </div>
         <div class=" nb-3 form-check">
            
            <input type="radio" id="radiobs" class="form-check-input"/>
            <label for="radiobs" class="form-check-label">yes/no</label>

         </div>
    <div class="form-check form-switch nb-3">
  <input class="form-check-input" type="checkbox" role="switch" id="flexCheckDefault"/>
  <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
</div>
         
</form>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
