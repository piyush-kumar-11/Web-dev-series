<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector</title>
    <style>
        div{
            /* Element Selector */
            /* background-color: red; */

        }
        /* Class Selector */
        .red{
            background-color: red;
        }
        /* ID selector */
        #green{
            background-color: green;
        }
        /* Child Selector */
        div, article > p {
            color:blue;
            background-color: brown;
        }
        /* Descendant SElector */
        div p {
              color:blue;
            background-color: brown;
        }
        /* Universal Selector */
        * {
            margin:0;
            padding:0;
        }
        /* Pseudo SElector */
        a:visited{
            color: yellow;
        }
        a:link{
            color:green;
        }
        a:active{
            background-color: red;
        }
        a:hover{
            background-color:yellow;
        }
        p:first-child{
            background-color: aqua;

        }


    </style>
</head>
<body>
    <main class="one">
        <p>I am first</p>
        <p>i am second </p>
    </main>
    <div class ="one">
        I am an one

    </div>
    <div class="red">
        I am a div
           <p> I am a para inside div </p>
    </div>
    <article>
         <p> I am a para inside div </p>
    </article>

 
    
    <div ID="green">
        I am another div
    </div>
  <a href="https://www.google.com">Go to Google</a>
  <a href="https://www.facebook2.com">GO to FaceBook</a>
</body>
</html>
